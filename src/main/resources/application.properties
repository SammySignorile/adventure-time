# ==========================================================
# ADVENTURE TIME - configurazione di avvio
# ==========================================================
# GUI oppure CLI
ui.mode=GUI

# IN_MEMORY attiva DEMO; DB e FILESYSTEM attivano FULL.
# Valori ammessi: DB, FILESYSTEM oppure IN_MEMORY.
persistence.mode=DB

# Percorso del file binario usato dalla persistenza FILESYSTEM
filesystem.path=data/adventure-time.dat

# MySQL viene inizializzato automaticamente quando si usa la modalita DB.
db.url=jdbc:mysql://localhost:3306/adventuretimedb?createDatabaseIfNotExist=true&serverTimezone=Europe/Rome
db.user=root
db.password=0000

# Dimensioni iniziali della finestra JavaFX
gui.width=960
gui.height=680
