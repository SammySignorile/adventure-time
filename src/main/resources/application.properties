# ==========================================================
# ADVENTURE TIME - configurazione di avvio
# ==========================================================
# GUI oppure CLI
ui.mode=GUI

# DEMO usa obbligatoriamente IN_MEMORY.
# FULL usa DB oppure FILESYSTEM.
app.mode=DEMO

# DB, FILESYSTEM oppure IN_MEMORY
persistence.mode=IN_MEMORY

# Percorso del file binario usato dalla persistenza FILESYSTEM
filesystem.path=data/adventure-time.dat

# Cartella che contiene le foto. Nel DB si salva solo il nome del file.
# Esempio: se nel DB c'è "roma 1.jpg", il programma cerca:
# C:/Users/<utente>/Desktop/AdventureTimeImages/roma 1.jpg
hotel.images.path=${user.home}/Desktop/AdventureTimeImages

# Configurazione MySQL usata soltanto con persistence.mode=DB
db.url=jdbc:mysql://localhost:3306/adventuretimedb?serverTimezone=Europe/Rome
db.user=root
db.password=root

# Dimensioni iniziali della finestra JavaFX
gui.width=960
gui.height=680
